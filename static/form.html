<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>drop2me</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  background:#f0f2f5;color:#1a1a1a}
.c{width:100%;max-width:460px;padding:1.5rem}
h1{text-align:center;margin-bottom:1.5rem;font-size:1.4rem;font-weight:600}
input[type=file]{width:100%;font-size:1rem;margin-bottom:1rem}
button{width:100%;padding:.875rem;font-size:1rem;border:none;border-radius:10px;
  background:#3b82f6;color:#fff;cursor:pointer;font-weight:500;transition:background .15s}
button:hover{background:#2563eb}
</style>
</head>
<body>
<div class="c">
  <h1>drop2me</h1>
  <form method="POST" action="" enctype="multipart/form-data">
    <input type="file" name="file">
    <button type="submit">Upload</button>
  </form>
</div>
</body>
</html>
