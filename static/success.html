<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>drop2me</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  background:#f0f2f5;color:#1a1a1a}
.c{width:100%;max-width:460px;padding:1.5rem;text-align:center}
h1{font-size:1.4rem;font-weight:600;color:#16a34a;margin-bottom:1rem}
ul{list-style:none;text-align:left;background:#fff;border-radius:10px;
  padding:1rem;margin-bottom:1.25rem}
li{padding:.625rem .75rem;border-bottom:1px solid #e5e7eb;word-break:break-all;font-size:.9rem}
li:last-child{border-bottom:none}
a{display:inline-block;padding:.875rem 2rem;background:#3b82f6;color:#fff;
  text-decoration:none;border-radius:10px;font-weight:500;font-size:1rem;
  transition:background .15s}
a:hover{background:#2563eb}
</style>
</head>
<body>
<div class="c">
  <h1>Uploaded!</h1>
  <ul>{{range .}}<li>{{.}}</li>{{end}}</ul>
  <a href="">Upload another</a>
</div>
</body>
</html>
